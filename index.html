<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام متابعة العملية التعليمية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#667;--pri:#14213d;--acc:#c9a227;--bd:#dde2ee;--ok:#1b8a5a;--bad:#c0392b;--warn:#d98e04;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1326;--card:#161f3a;--tx:#eef1fa;--mut:#9aa6c4;--pri:#c9a227;--bd:#2a3659}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#14213d,#274472);color:#fff;padding:18px 16px;border-bottom:4px solid var(--acc)}
header h1{margin:0;font-size:1.15rem}header small{opacity:.8}
main{max-width:1000px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:.9rem}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}
button{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button{color:#0d1326}}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.g{background:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border:1px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--bg);user-select:none}
.chip.on{background:var(--acc);color:#14213d;border-color:var(--acc);font-weight:700}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sb{padding:14px;border:2px solid var(--c);border-radius:12px;text-align:center;font-weight:700;cursor:pointer;color:var(--c);background:var(--bg);user-select:none}.sb.on{background:var(--c);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}
.p{border-right:4px solid var(--acc);background:var(--bg);padding:10px;border-radius:9px;margin:12px 0}
.en{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px;position:relative}
.x{position:absolute;left:8px;top:8px;background:var(--bad);color:#fff;padding:2px 9px}
button.add{width:100%;margin-top:10px;background:transparent;color:var(--acc);border:2px dashed var(--acc)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{border:1px solid var(--bd);padding:7px;text-align:right;vertical-align:top}th{background:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) th{color:#0d1326}}
.st{padding:2px 8px;border-radius:10px;color:#fff;font-size:.78rem;white-space:nowrap}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px}.k div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.k b{font-size:1.5rem;display:block;color:var(--acc)}
.err{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
#pa{display:none}@media print{@page{size:A4 landscape;margin:10mm}body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff}#pa table{font-size:10px}th{background:#ddd!important;color:#000!important}}
</style></head><body>
<header><h1>🎓 نظام متابعة العملية التعليمية</h1><small>كلية الهندسة — متابعة الأقسام والبرامج · v4</small></header>
<main id="app"></main><div id="pa"></div>
<script>
const API="https://ozudwwjdmtfkmpcxhitq.supabase.co/functions/v1/api";
const DEPTS=["قسم الرياضيات والفيزياء الهندسية","قسم الهندسة الكهربية","قسم هندسة الحاسبات والنظم","قسم هندسة الري والهيدروليكا","قسم هندسة الإلكترونيات والاتصالات","قسم هندسة الغزل والنسيج","قسم الهندسة الإنشائية","قسم هندسة الأشغال العامة","قسم الهندسة المعمارية","قسم هندسة الإنتاج والتصميم الميكانيكي","قسم هندسة القوى الميكانيكية","برنامج هندسة الميكاترونيكس","برنامج هندسة الاتصالات والحاسبات","برنامج الهندسة الطبية والحيوية","برنامج هندسة الذكاء الاصطناعي","برنامج هندسة الطاقة المتجددة والمستدامة","برنامج هندسة البناء والتشييد","برنامج هندسة العمارة المستدامة"];
const LV=["الفرقة الإعدادية","الفرقة الأولى","الفرقة الثانية","الفرقة الثالثة","الفرقة الرابعة"];
const DAYS=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"],PER=["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة"];
const ST={ok:["ملتزم","var(--ok)"],bad:["غير ملتزم","var(--bad)"],excuse:["عذر","var(--warn)"],other:["أخرى","#6b7a99"]};
const ICON={ok:"✅",bad:"❌",excuse:"📝",other:"⚪"};
const BADGE={"ملتزم":"var(--ok)","غير ملتزم":"var(--bad)","عذر":"var(--warn)","أخرى":"#6b7a99","لم يُسجَّل":"#9aa3b5"};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=(t,c)=>`<p class="${c||"err"}">${esc(t)}</p>`;
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let TOKEN=null,S={},reports=[],timer=null,REF=null,ME={name:"",role:""};
async function api(action,data){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-session":TOKEN||""},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j}
function login(note){
 app.innerHTML=`<div class="card" style="max-width:440px;margin:30px auto"><h2 style="margin-top:0">🔐 تسجيل الدخول</h2>
 <label>القسم / البرنامج</label><select id="d"><option value="admin">⭐ المشرف العام للنظام</option>${DEPTS.map((n,i)=>`<option value="d${i}">${esc(n)}</option>`).join("")}</select>
 <label>كلمة المرور</label><input id="pw" type="password" autocomplete="off"><div id="m">${note||""}</div><br><button id="go" style="width:100%">دخول</button></div>`;
 const go=async()=>{const id=$("#d").value,pw=$("#pw").value;$("#go").disabled=true;
  try{const r=await api("login",{id,password:pw});TOKEN=r.token;S={role:r.role,dept:id};id==="admin"?admin():dept()}
  catch(e){$("#go").disabled=false;$("#m").innerHTML=msg(e&&e.error||"تعذر الاتصال بالخادم")}};
 $("#go").onclick=go;$("#pw").onkeydown=e=>e.key==="Enter"&&go()}
/* ================= مشرف القسم ================= */
function dept(){
 const name=DEPTS[+S.dept.slice(1)],td=fmt(new Date());
 const F={date:td,ds:null,P:{}},empty=()=>({member:"",place:"",level:"",notes:""});
 app.innerHTML=`<div class="bar"><h2 style="margin:0">${esc(name)}</h2><button class="s" id="out">خروج</button></div>
 <div class="card"><h3 style="margin-top:0">📝 إضافة تقرير متابعة</h3>
 <div class="row"><div><label>اسم مُدخل التقرير</label><input id="rn" value="${esc(ME.name)}"></div>
 <div><label>الصفة</label><select id="rr"><option value="">اختر الصفة</option><option>عضو هيئة تدريس</option><option>عضو هيئة معاونة</option></select></div></div>
 <label>تاريخ اليوم (يمكنك اختيار يوم سابق نسيت تسجيله)</label><input type="date" id="dt" value="${td}" max="${td}"><div id="dl" class="ok"></div>
 <label>حالة العملية التعليمية</label><div class="sg" id="sg">${Object.keys(ST).map(k=>`<span class="sb" data-k="${k}" style="--c:${ST[k][1]}">${ICON[k]} ${ST[k][0]}</span>`).join("")}</div>
 <div id="more" style="display:none"><label>الفترات (يمكن اختيار أكثر من فترة)</label><div class="chips" id="pers">${PER.map((x,i)=>`<span class="chip" data-v="${i}">${x}</span>`).join("")}</div>
 <div id="pc"></div><label>الإجراءات التصحيحية التي تم اتخاذها</label><textarea id="cor"></textarea></div>
 <div id="m"></div><br><button class="g" id="sub">إرسال التقرير</button></div>`;
 $("#rr").value=ME.role;$("#out").onclick=()=>{TOKEN=null;S={};login()};
 const wdOf=d=>new Date(d+"T12:00:00").getDay();
 const dl=()=>{const w=wdOf(F.date);$("#dl").className=w===5?"err":"ok";$("#dl").textContent=!F.date?"":w===5?"الجمعة إجازة، اختر يومًا من السبت إلى الخميس":"📅 "+DAYS[(w+1)%7]};
 $("#dt").onchange=()=>{F.date=$("#dt").value;dl()};dl();
 const draw=()=>{$("#more").style.display=F.ds&&F.ds!=="ok"?"block":"none";
  document.querySelectorAll(".sb").forEach(b=>b.classList.toggle("on",b.dataset.k===F.ds));
  document.querySelectorAll("#pers .chip").forEach(c=>c.classList.toggle("on",!!F.P[c.dataset.v]));
  $("#pc").innerHTML=Object.keys(F.P).map(Number).sort().map(p=>`<div class="p"><b>الفترة ${PER[p]}</b>${F.P[p].map((e,j)=>`<div class="en" data-p="${p}" data-j="${j}">${F.P[p].length>1?`<button class="x" data-rm>✕</button>`:""}
  <div class="row"><div><label>عضو هيئة التدريس / عضو هيئة معاونة</label><input data-f="member" value="${esc(e.member)}"></div><div><label>المكان</label><input data-f="place" value="${esc(e.place)}"></div></div>
  <label>الفرقة الدراسية</label><select data-f="level"><option value="">اختر الفرقة</option>${LV.map(x=>`<option${e.level===x?" selected":""}>${x}</option>`).join("")}</select>
  <label>المشاكل المتاحة / ملاحظات</label><textarea data-f="notes">${esc(e.notes)}</textarea></div>`).join("")}
  <button class="add" data-add="${p}">➕ إضافة فرقة / مكان / عضو آخر لنفس الفترة</button></div>`).join("")};
 $("#sg").onclick=e=>{const b=e.target.closest(".sb");if(!b)return;F.ds=b.dataset.k;draw()};
 $("#pers").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const p=c.dataset.v;F.P[p]?delete F.P[p]:F.P[p]=[empty()];draw()};
 $("#pc").oninput=e=>{const t=e.target,en=t.closest(".en");if(en&&t.dataset.f)F.P[+en.dataset.p][+en.dataset.j][t.dataset.f]=t.value};
 $("#pc").onclick=e=>{const a=e.target.closest("[data-add]");if(a){F.P[+a.dataset.add].push(empty());draw();return}
  const r=e.target.closest("[data-rm]");if(r){const en=r.closest(".en");F.P[+en.dataset.p].splice(+en.dataset.j,1);draw()}};
 $("#sub").onclick=async()=>{const er=t=>{$("#m").innerHTML=msg(t)},nm=$("#rn").value.trim(),rl=$("#rr").value;
  if(!nm||!rl)return er("اكتب اسمك واختر صفتك (عضو هيئة تدريس / عضو هيئة معاونة)");
  if(!F.date||F.date>td)return er("اختر تاريخًا صحيحًا (لا يمكن اختيار تاريخ مستقبلي)");
  if(wdOf(F.date)===5)return er("الجمعة إجازة، اختر يومًا من السبت إلى الخميس");
  if(!F.ds)return er("اختر حالة العملية التعليمية");
  const entries=[];
  if(F.ds!=="ok"){for(const p of Object.keys(F.P).map(Number).sort())for(const e of F.P[p])entries.push({p,member:e.member.trim(),place:e.place.trim(),level:e.level,notes:e.notes.trim()});
   if(!entries.length)return er("اختر فترة واحدة على الأقل");
   if(entries.some(x=>!x.member))return er("اكتب اسم عضو هيئة التدريس / عضو هيئة معاونة في كل بيان");
   if(entries.some(x=>!x.level))return er("اختر الفرقة الدراسية في كل بيان")}
  ME={name:nm,role:rl};$("#sub").disabled=true;
  try{await api("add_report",{date:F.date,dayStatus:F.ds,reporter:ME,entries,corrective:F.ds==="ok"?"":$("#cor").value.trim()});
   $("#m").innerHTML=msg("✓ تم إرسال التقرير بنجاح","ok");setTimeout(dept,1200)}
  catch(e){$("#sub").disabled=false;er(e&&e.error||"تعذر الإرسال، حاول مرة أخرى")}}}
/* ================= بيانات التقارير ================= */
const dstat=x=>x.dayStatus||((x.entries||[]).some(e=>e.status==="prob"||e.status==="bad")?"bad":(x.entries||[]).length?"other":"ok");
const rows=r=>r.flatMap(x=>(x.entries&&x.entries.length?x.entries:[null]).map((e,i)=>({_id:x.id,_i:e?i:-1,"القسم":x.deptName,"التاريخ":x.date,"اليوم":x.day,"حالة اليوم":ST[dstat(x)][0],"الفترة":e?PER[e.p]:"","عضو هيئة التدريس / عضو هيئة معاونة":e?.member||"","المكان":e?.place||"","الفرقة":e?.level||"","المشاكل / الملاحظات":e?.notes||"","الإجراءات التصحيحية":x.corrective||"","مُدخل التقرير":x.reporter?.name||"","الصفة":x.reporter?.role||""})));
const clean=o=>Object.fromEntries(Object.entries(o).filter(([k])=>k[0]!=="_"));
function tbl(r,del,pre){const x=pre||rows(r),h=Object.keys(x[0]||{"القسم":0}).filter(k=>k[0]!=="_");
 const body=x.map(o=>`<tr>${h.map(k=>`<td>${BADGE[o[k]]?`<span class="st" style="background:${BADGE[o[k]]}">${esc(o[k])}</span>`:esc(o[k])}</td>`).join("")}${del?`<td style="white-space:nowrap">${o._i>=0?`<button class="s" data-delp="${esc(o._id)}" data-i="${o._i}">🗑 البيان</button> `:""}<button class="s" data-del="${esc(o._id)}">🗑 التقرير</button></td>`:""}</tr>`).join("")||`<tr><td>لا توجد بيانات</td></tr>`;
 return `<table dir="rtl"><tr>${h.map(k=>`<th>${k}</th>`).join("")}${del?"<th>حذف</th>":""}</tr>${body}</table>`}
const deptOpts=DEPTS.map((n,i)=>`<option value="d${i}">${esc(n)}</option>`).join("");
/* ================= المشرف العام ================= */
function admin(){
 app.innerHTML=`<div class="bar"><h2 style="margin:0">⭐ لوحة المشرف العام</h2><button class="s" id="out">خروج</button></div>
 <div class="bar"><div class="chips" id="tabs"><span class="chip on" data-t="r">التقارير اليومية</span><span class="chip" data-t="w">التقرير الأسبوعي</span><span class="chip" data-t="p">كلمات المرور</span></div></div><div id="body"></div>`;
 $("#out").onclick=()=>{clearInterval(timer);TOKEN=null;S={};login()};
 $("#tabs").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;document.querySelectorAll("#tabs .chip").forEach(x=>x.classList.toggle("on",x===c));const t=c.dataset.t;t==="r"?repView():t==="w"?weekView():pwView()};
 const load=async()=>{try{reports=(await api("list_reports")).reports;REF&&REF()}catch(e){}};load();clearInterval(timer);timer=setInterval(load,30000);
 repView()}
const cur=()=>{const d=$("#fd").value,y=$("#fy").value,s=$("#fs").value,a=$("#f1").value,b=$("#f2").value;return reports.filter(r=>(!d||r.dept===d)&&(!y||r.day===y)&&(!s||dstat(r)===s)&&(!a||r.date>=a)&&(!b||r.date<=b))};
function fill(){const r=cur();$("#tbl").outerHTML=tbl(r,true).replace("<table","<table id='tbl'");
 $("#kp").innerHTML=`<div><b>${r.length}</b>تقرير</div>`+Object.keys(ST).map(k=>`<div><b style="color:${ST[k][1]}">${r.filter(x=>dstat(x)===k).length}</b>${ST[k][0]}</div>`).join("")}
function repView(){
 $("#body").onclick=async e=>{const b=e.target.closest("[data-del],[data-delp]");if(!b)return;const one=b.dataset.delp!==undefined,id=one?b.dataset.delp:b.dataset.del,i=+b.dataset.i;
  if(!confirm((one?"حذف هذا البيان من التقرير؟":"حذف التقرير بالكامل بكل بياناته؟")+" لا يمكن التراجع."))return;
  try{if(one){await api("delete_entry",{id,i});reports=reports.flatMap(r=>{if(r.id!==id)return[r];const en=r.entries.filter((_,k)=>k!==i);return en.length?[{...r,entries:en}]:[]})}else{await api("delete_report",{id});reports=reports.filter(r=>r.id!==id)}fill()}catch(err){alert(err&&err.error||"تعذر الحذف")}};
 $("#body").innerHTML=`<div class="card"><div id="kp" class="k"></div><div class="row"><div><label>القسم</label><select id="fd"><option value="">الكل</option>${deptOpts}</select></div>
 <div><label>اليوم</label><select id="fy"><option value="">الكل</option>${DAYS.map(x=>`<option>${x}</option>`).join("")}</select></div>
 <div><label>حالة اليوم</label><select id="fs"><option value="">الكل</option>${Object.keys(ST).map(k=>`<option value="${k}">${ST[k][0]}</option>`).join("")}</select></div><div></div>
 <div><label>من تاريخ</label><input type="date" id="f1"></div><div><label>إلى تاريخ</label><input type="date" id="f2"></div></div><br>
 <div class="chips"><button id="xl">⬇ Excel</button><button id="pdf" class="s">⬇ PDF / طباعة</button></div></div>
 <div class="card tw"><table id="tbl"></table></div>`;
 ["fd","fy","fs","f1","f2"].forEach(i=>$("#"+i).onchange=fill);
 $("#xl").onclick=()=>{const ws=XLSX.utils.json_to_sheet(rows(cur()).map(clean));ws["!cols"]=Array(13).fill({wch:22});const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,"التقارير");XLSX.writeFile(wb,"تقارير-المتابعة.xlsx")};
 $("#pdf").onclick=()=>{$("#pa").innerHTML=`<h2 dir="rtl">تقرير متابعة العملية التعليمية</h2>`+tbl(cur());window.print()};
 REF=fill;fill()}
/* ---------- التقرير الأسبوعي (السبت - الخميس) ---------- */
const weekDates=ds=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-(d.getDay()+1)%7);return[...Array(6)].map((_,i)=>{const e=new Date(d);e.setDate(d.getDate()+i);return fmt(e)})};
function wk(){const ds=weekDates($("#wd").value||fmt(new Date())),sc=$("#ws").value,ids=sc?[sc]:DEPTS.map((_,i)=>"d"+i);
 const rs=reports.filter(r=>ds.includes(r.date)&&ids.includes(r.dept));
 const sum=ids.map(id=>{const o={"القسم":DEPTS[+id.slice(1)]};ds.forEach((d,i)=>{const g=rs.filter(r=>r.dept===id&&r.date===d).map(dstat),k=["bad","excuse","other","ok"].find(z=>g.includes(z));o[DAYS[i]+" "+d.slice(5)]=k?ST[k][0]:"لم يُسجَّل"});o["عدد التقارير"]=rs.filter(r=>r.dept===id).length;return o});
 return{ds,ids,rs,sum}}
function weekView(){
 $("#body").onclick=null;
 $("#body").innerHTML=`<div class="card"><h3 style="margin-top:0">📅 التقرير الأسبوعي</h3><div class="row"><div><label>اختر أي يوم داخل الأسبوع</label><input type="date" id="wd" value="${fmt(new Date())}"></div>
 <div><label>النطاق</label><select id="ws"><option value="">كل الأقسام والبرامج</option>${deptOpts}</select></div></div><p id="wr" style="color:var(--mut)"></p>
 <div class="chips"><button id="wx">⬇ Excel</button><button id="wp" class="s">⬇ PDF / طباعة</button></div>
 <p style="color:var(--mut);font-size:.85rem">عند اختيار «كل الأقسام والبرامج»: ملخص أسبوعي ثم ورقة (Excel) أو صفحة (PDF) منفصلة لكل قسم وبرنامج.</p></div><div class="card tw" id="wt"></div>`;
 const up=()=>{const w=wk();$("#wr").textContent=`الأسبوع من ${w.ds[0]} إلى ${w.ds[5]}`;$("#wt").innerHTML=tbl(0,0,w.sum)};
 $("#wd").onchange=$("#ws").onchange=up;REF=up;up();
 $("#wx").onclick=()=>{const w=wk(),wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  const add=(n,d)=>{const ws=XLSX.utils.json_to_sheet(d);ws["!cols"]=Array(14).fill({wch:22});XLSX.utils.book_append_sheet(wb,ws,n.replace(/[\\\/?*\[\]:]/g,"").slice(0,31))};
  add("الملخص الأسبوعي",w.sum);
  w.ids.forEach(id=>{const r=w.rs.filter(x=>x.dept===id);if(r.length)add((+id.slice(1)+1)+"-"+DEPTS[+id.slice(1)].replace(/^(قسم|برنامج) /,"").slice(0,26),rows(r).map(clean))});
  XLSX.writeFile(wb,`تقرير-اسبوعي-${w.ds[0]}.xlsx`)};
 $("#wp").onclick=()=>{const w=wk();$("#pa").innerHTML=`<h2 dir="rtl">التقرير الأسبوعي لمتابعة العملية التعليمية</h2><p dir="rtl">من ${w.ds[0]} إلى ${w.ds[5]}</p>`+tbl(0,0,w.sum)+
  w.ids.filter(id=>w.rs.some(r=>r.dept===id)).map(id=>`<div style="page-break-before:always" dir="rtl"><h3>${esc(DEPTS[+id.slice(1)])}</h3>${tbl(w.rs.filter(r=>r.dept===id))}</div>`).join("");window.print()}}
/* ---------- كلمات المرور ---------- */
function pwView(){
 REF=null;$("#body").onclick=null;
 $("#body").innerHTML=`<div class="card"><h3 style="margin-top:0">🔑 تغيير كلمة المرور</h3><p style="color:var(--mut)">أنت وحدك من يملك هذه الصلاحية. تُخزَّن كلمة المرور مشفّرة ولا يمكن استرجاعها.</p>
 <label>الجهة</label><select id="t"><option value="admin">⭐ المشرف العام</option>${deptOpts}</select>
 <label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="np" type="text" autocomplete="off"><div id="m"></div><br><button id="sv">حفظ</button></div>`;
 $("#sv").onclick=async()=>{const p=$("#np").value;if(p.length<10){$("#m").innerHTML=msg("كلمة المرور قصيرة");return}
  try{await api("set_password",{target:$("#t").value,password:p});$("#np").value="";$("#m").innerHTML=msg("✓ تم تغيير كلمة المرور","ok")}catch(e){$("#m").innerHTML=msg("تعذر الحفظ")}}}
login();
</script></body></html>
