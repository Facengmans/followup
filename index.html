<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام متابعة العملية التعليمية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#667;--pri:#14213d;--acc:#c9a227;--bd:#dde2ee;--ok:#1b8a5a;--bad:#c0392b;--warn:#d98e04;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1326;--card:#161f3a;--tx:#eef1fa;--mut:#9aa6c4;--pri:#c9a227;--bd:#2a3659}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#14213d,#274472);color:#fff;padding:18px 16px;border-bottom:4px solid var(--acc)}
header h1{margin:0;font-size:1.15rem}header small{opacity:.8}
main{max-width:1000px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:.9rem}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}
button{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button{color:#0d1326}}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.g{background:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border:1px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--bg);user-select:none}
.chip.on{background:var(--acc);color:#14213d;border-color:var(--acc);font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}
.p{border-right:4px solid var(--acc);background:var(--bg);padding:10px;border-radius:9px;margin:10px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{border:1px solid var(--bd);padding:7px;text-align:right;vertical-align:top}th{background:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) th{color:#0d1326}}
.st{padding:2px 8px;border-radius:10px;color:#fff;font-size:.78rem;white-space:nowrap}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.k div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.k b{font-size:1.5rem;display:block;color:var(--acc)}
.err{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
#pa{display:none}@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff}th{background:#ddd!important;color:#000!important}}
</style></head><body>
<header><h1>🎓 نظام متابعة العملية التعليمية</h1><small>كلية الهندسة — متابعة الأقسام والبرامج</small></header>
<main id="app"></main><div id="pa"></div>
<script>
const DEPTS=["قسم الرياضيات والفيزياء الهندسية","قسم الهندسة الكهربية","قسم هندسة الحاسبات والنظم","قسم هندسة الري والهيدروليكا","قسم هندسة الإلكترونيات والاتصالات","قسم هندسة الغزل والنسيج","قسم الهندسة الإنشائية","قسم هندسة الأشغال العامة","قسم الهندسة المعمارية","قسم هندسة الإنتاج والتصميم الميكانيكي","قسم هندسة القوى الميكانيكية","برنامج هندسة الميكاترونيكس","برنامج هندسة الاتصالات والحاسبات","برنامج الهندسة الطبية والحيوية","برنامج هندسة الذكاء الاصطناعي","برنامج هندسة الطاقة المتجددة والمستدامة","برنامج هندسة البناء والتشييد","برنامج هندسة العمارة المستدامة"];
const DAYS=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"],PER=["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة"];
const ST={ok:["ملتزم","var(--ok)"],bad:["غير ملتزم","var(--bad)"],excuse:["عذر","var(--warn)"],other:["أخرى","#6b7a99"],prob:["غير ملتزم","var(--bad)"],note:["أخرى","#6b7a99"]};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbk(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:unhex(salt),iterations:100000},k,256))}
const API="https://ozudwwjdmtfkmpcxhitq.supabase.co/functions/v1/api";
let TOKEN=null,S={role:null,dept:null},reports=[],timer=null;
async function api(action,data){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-session":TOKEN||""},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j}
function msg(t,c){return `<p class="${c||"err"}">${esc(t)}</p>`}
function login(note){
 app.innerHTML=`<div class="card" style="max-width:440px;margin:30px auto"><h2 style="margin-top:0">🔐 تسجيل الدخول</h2>
 <label>القسم / البرنامج</label><select id="d"><option value="admin">⭐ المشرف العام للنظام</option>${DEPTS.map((n,i)=>`<option value="d${i}">${esc(n)}</option>`).join("")}</select>
 <label>كلمة المرور</label><input id="pw" type="password" autocomplete="off"><div id="m">${note||""}</div><br><button id="go" style="width:100%">دخول</button></div>`;
 const go=async()=>{
  const id=$("#d").value,pw=$("#pw").value;$("#go").disabled=true;
  try{const r=await api("login",{id,password:pw});TOKEN=r.token;S={role:r.role,dept:id};id==="admin"?admin():dept()}
  catch(e){$("#go").disabled=false;$("#m").innerHTML=msg(e&&e.error||"تعذر الاتصال بالخادم")}};
 $("#go").onclick=go;$("#pw").onkeydown=e=>e.key==="Enter"&&go()}
/* ---------- supervisor of a department ---------- */
function dept(){
 const name=DEPTS[+S.dept.slice(1)];let selD=null,selP=new Set();
 const d0=new Date();const today=d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0")+"-"+String(d0.getDate()).padStart(2,"0");
 app.innerHTML=`<div class="bar"><h2 style="margin:0">${esc(name)}</h2><button class="s" id="out">خروج</button></div>
 <div class="card"><h3 style="margin-top:0">📝 إضافة تقرير متابعة</h3>
 <label>التاريخ</label><input type="date" id="dt" value="${today}">
 <label>اليوم</label><div class="chips" id="days">${DAYS.map(x=>`<span class="chip" data-v="${x}">${x}</span>`).join("")}</div>
 <label>الفترات (يمكن اختيار أكثر من فترة)</label><div class="chips" id="pers">${PER.map((x,i)=>`<span class="chip" data-v="${i}">${x}</span>`).join("")}</div>
 <div id="pc"></div>
 <label>الإجراءات التصحيحية التي تم اتخاذها</label><textarea id="cor"></textarea>
 <div id="m"></div><br><button class="g" id="sub">إرسال التقرير</button></div>`;
 $("#out").onclick=()=>{TOKEN=null;S={};login()};
 $("#days").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;document.querySelectorAll("#days .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");selD=c.dataset.v};
 const draw=()=>{const keep={};document.querySelectorAll(".p").forEach(p=>keep[p.dataset.i]=[...p.querySelectorAll("input,select,textarea")].map(x=>x.value));
  $("#pc").innerHTML=[...selP].sort().map(i=>`<div class="p" data-i="${i}"><b>الفترة ${PER[i]}</b><div class="row"><div><label>عضو هيئة التدريس</label><input></div><div><label>المكان</label><input></div></div>
  <label>الحالة</label><select>${["ok","bad","excuse","other"].map(k=>`<option value="${k}">${ST[k][0]}</option>`).join("")}</select><label>المشاكل المتاحة / ملاحظات</label><textarea></textarea></div>`).join("");
  document.querySelectorAll(".p").forEach(p=>{const k=keep[p.dataset.i];if(k)[...p.querySelectorAll("input,select,textarea")].forEach((x,j)=>x.value=k[j])})};
 $("#pers").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;c.classList.toggle("on");const v=c.dataset.v;selP.has(v)?selP.delete(v):selP.add(v);draw()};
 $("#sub").onclick=async()=>{
  if(!selD||!selP.size||!$("#dt").value){$("#m").innerHTML=msg("اختر التاريخ واليوم وفترة واحدة على الأقل");return}
  const entries=[...document.querySelectorAll(".p")].map(p=>{const[a,b,s,n]=[...p.querySelectorAll("input,select,textarea")].map(x=>x.value.trim());return{p:+p.dataset.i,member:a,place:b,status:s,notes:n}});
  if(entries.some(x=>!x.member)){$("#m").innerHTML=msg("اكتب اسم عضو هيئة التدريس لكل فترة");return}
  $("#sub").disabled=true;
  try{await api("add_report",{day:selD,date:$("#dt").value,entries,corrective:$("#cor").value.trim()});
   $("#m").innerHTML=msg("✓ تم إرسال التقرير بنجاح","ok");selP.clear();selD=null;setTimeout(dept,1200)}
  catch(e){$("#sub").disabled=false;$("#m").innerHTML=msg("تعذر الإرسال، حاول مرة أخرى")}}}
/* ---------- general supervisor ---------- */
const rows=r=>r.flatMap(x=>(x.entries||[]).map(e=>({"_id":x.id,"_p":e.p,"القسم":x.deptName,"التاريخ":x.date,"اليوم":x.day,"الفترة":PER[e.p],"عضو هيئة التدريس":e.member,"المكان":e.place,"الحالة":ST[e.status]?.[0]||"","المشاكل / الملاحظات":e.notes,"الإجراءات التصحيحية":x.corrective})));
function admin(){
 app.innerHTML=`<div class="bar"><h2 style="margin:0">⭐ لوحة المشرف العام</h2><button class="s" id="out">خروج</button></div>
 <div class="bar"><div class="chips" id="tabs"><span class="chip on" data-t="r">التقارير</span><span class="chip" data-t="p">كلمات المرور</span></div></div><div id="body"></div>`;
 $("#out").onclick=()=>{clearInterval(timer);TOKEN=null;S={};login()};
 $("#tabs").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;document.querySelectorAll("#tabs .chip").forEach(x=>x.classList.toggle("on",x===c));c.dataset.t==="r"?repView():pwView()};
 const load=async()=>{try{reports=(await api("list_reports")).reports;if($("#tbl"))fill()}catch(e){}};load();clearInterval(timer);timer=setInterval(load,30000);
 repView()}
function repView(){
 $("#body").onclick=async e=>{const b=e.target.closest("[data-del],[data-delp]");if(!b)return;const one=b.dataset.delp!==undefined,id=one?b.dataset.delp:b.dataset.del,p=+b.dataset.p;
  if(!confirm((one?"حذف هذه الفترة من التقرير؟":"حذف التقرير بالكامل بكل فتراته؟")+" لا يمكن التراجع."))return;
  try{if(one){await api("delete_entry",{id,p});reports=reports.map(r=>r.id===id?{...r,entries:r.entries.filter(x=>x.p!==p)}:r).filter(r=>r.entries.length)}else{await api("delete_report",{id});reports=reports.filter(r=>r.id!==id)}fill()}catch(err){alert(err&&err.error||"تعذر الحذف")}};
 $("#body").innerHTML=`<div class="card"><div id="kp" class="k"></div><div class="row"><div><label>القسم</label><select id="fd"><option value="">الكل</option>${DEPTS.map((n,i)=>`<option value="d${i}">${esc(n)}</option>`).join("")}</select></div>
 <div><label>اليوم</label><select id="fy"><option value="">الكل</option>${DAYS.map(x=>`<option>${x}</option>`).join("")}</select></div>
 <div><label>من تاريخ</label><input type="date" id="f1"></div><div><label>إلى تاريخ</label><input type="date" id="f2"></div></div><br>
 <div class="chips"><button id="xl">⬇ Excel</button><button id="pdf" class="s">⬇ PDF / طباعة</button></div></div>
 <div class="card tw"><table id="tbl"></table></div>`;
 ["fd","fy","f1","f2"].forEach(i=>$("#"+i).onchange=fill);
 $("#xl").onclick=()=>{const ws=XLSX.utils.json_to_sheet(rows(cur()).map(({_id,_p,...o})=>o));ws["!cols"]=Array(9).fill({wch:22});const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,"التقارير");XLSX.writeFile(wb,"تقارير-المتابعة.xlsx")};
 $("#pdf").onclick=()=>{$("#pa").innerHTML=`<h2 dir="rtl">تقرير متابعة العملية التعليمية</h2>`+tbl(cur());window.print()};
 fill()}
const cur=()=>{const d=$("#fd").value,y=$("#fy").value,a=$("#f1").value,b=$("#f2").value;return reports.filter(r=>(!d||r.dept===d)&&(!y||r.day===y)&&(!a||r.date>=a)&&(!b||r.date<=b))};
function tbl(r,del){const x=rows(r);const h=Object.keys(x[0]||{"_id":0,"القسم":0}).filter(k=>k[0]!=="_");
 const body=x.map(o=>{return `<tr>${h.map(k=>`<td>${k==="الحالة"?`<span class="st" style="background:${Object.values(ST).find(v=>v[0]===o[k])?.[1]||"#888"}">${esc(o[k])}</span>`:esc(o[k])}</td>`).join("")}${del?`<td style="white-space:nowrap"><button class="s" data-delp="${esc(o._id)}" data-p="${o._p}">🗑 الفترة</button> <button class="s" data-del="${esc(o._id)}">🗑 التقرير</button></td>`:""}</tr>`}).join("")||`<tr><td>لا توجد تقارير</td></tr>`;
 return `<table dir="rtl"><tr>${h.map(k=>`<th>${k}</th>`).join("")}${del?"<th>حذف</th>":""}</tr>${body}</table>`}
function fill(){const r=cur(),x=rows(r);$("#tbl").outerHTML=tbl(r,true).replace("<table","<table id='tbl'");
 const c=s=>x.filter(o=>o["الحالة"]===s).length;
 $("#kp").innerHTML=`<div><b>${r.length}</b>تقرير</div><div><b>${x.length}</b>فترة</div><div><b style="color:var(--ok)">${c("ملتزم")}</b>ملتزم</div><div><b style="color:var(--bad)">${c("غير ملتزم")}</b>غير ملتزم</div><div><b style="color:var(--warn)">${c("عذر")}</b>عذر</div><div><b style="color:#6b7a99">${c("أخرى")}</b>أخرى</div>`}
function pwView(){
 $("#body").innerHTML=`<div class="card"><h3 style="margin-top:0">🔑 تغيير كلمة المرور</h3><p style="color:var(--mut)">أنت وحدك من يملك هذه الصلاحية. يتم تخزين كلمة المرور مشفّرة (PBKDF2) ولا يمكن استرجاعها.</p>
 <label>الجهة</label><select id="t"><option value="admin">⭐ المشرف العام</option>${DEPTS.map((n,i)=>`<option value="d${i}">${esc(n)}</option>`).join("")}</select>
 <label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="np" type="text" autocomplete="off"><div id="m"></div><br><button id="sv">حفظ</button></div>`;
 $("#sv").onclick=async()=>{const p=$("#np").value;if(p.length<10){$("#m").innerHTML=msg("كلمة المرور قصيرة");return}
    try{await api("set_password",{target:$("#t").value,password:p});$("#np").value="";$("#m").innerHTML=msg("✓ تم تغيير كلمة المرور","ok")}catch(e){$("#m").innerHTML=msg("تعذر الحفظ")}}}
login();
</script></body></html>
